<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>New Tab</title>
    <link rel="stylesheet" href="css/newtab.css" />
  </head>
  <body>
    <main class="stage">
      <h1 class="brand">Predictive Nav</h1>

      <div class="bar">
        <div class="ghost" id="ghost" aria-hidden="true"></div>
        <input
          id="nav-input"
          type="text"
          autofocus
          autocomplete="off"
          spellcheck="false"
          autocapitalize="off"
          autocorrect="off"
          enterkeyhint="go"
          inputmode="text"
          placeholder="Start typing a site or a search…"
          aria-label="Type a site name or a search query"
        />
        <div class="progress" id="progress" aria-hidden="true"><i></i></div>
      </div>

      <ul class="suggestions" id="suggestions"></ul>

      <p class="status" id="status" role="status"></p>
      <p class="hint">
        Known sites go instantly · anything else becomes a search<span
          class="hint-keys"
        >
          · start with a space to pick for yourself</span
        ><span class="hint-touch"> · tap anywhere to start typing</span>
      </p>

      <div class="banner" id="banner" role="alert"></div>

      <p class="diagnostics" id="diagnostics"></p>

      <div class="settings" id="settings" hidden>
        <p class="setting-counts" id="setting-counts"></p>
        <label class="setting">
          <span>Speed</span>
          <select id="setting-speed">
            <option value="1">Fast — go as soon as it is sure</option>
            <option value="2">Relaxed — a moment to change your mind</option>
            <option value="3.5">Slow — plenty of time to keep typing</option>
          </select>
        </label>
        <label class="setting">
          <input type="checkbox" id="setting-yours" />
          <span>List your sites under an empty bar</span>
        </label>
        <div class="setting-sites" id="setting-sites"></div>
      </div>
    </main>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
