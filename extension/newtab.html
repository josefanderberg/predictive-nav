<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PreNav</title>
    <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-128.png" />
    <link rel="stylesheet" href="css/newtab.css" />
  </head>
  <body>
    <main class="stage">
      <h1 class="brand">PreNav</h1>

      <div class="bar">
        <div class="ghost" id="ghost" aria-hidden="true"></div>
        <input
          id="nav-input"
          type="text"
          autofocus
          autocomplete="off"
          spellcheck="false"
          autocapitalize="off"
          autocorrect="off"
          enterkeyhint="go"
          inputmode="text"
          placeholder="Start typing a site or a search…"
          aria-label="Type a site name or a search query"
        />
        <div class="progress" id="progress" aria-hidden="true"><i></i></div>
      </div>

      <ul class="suggestions" id="suggestions"></ul>

      <p class="status" id="status" role="status"></p>
      <p class="hint">
        Known sites go instantly · anything else becomes a search<span
          class="hint-keys"
        >
          · start with a space to pick for yourself</span
        ><span class="hint-touch"> · tap anywhere to start typing</span>
      </p>

      <div class="banner" id="banner" role="alert"></div>

      <p class="diagnostics" id="diagnostics"></p>

      <div class="settings" id="settings" hidden>
        <p class="setting-counts" id="setting-counts"></p>
        <label class="setting">
          <span>Speed</span>
          <select id="setting-speed">
            <option value="1">Fast — go as soon as it is sure</option>
            <option value="2">Relaxed — a moment to change your mind</option>
            <option value="3.5">Slow — plenty of time to keep typing</option>
          </select>
        </label>
        <label class="setting">
          <input type="checkbox" id="setting-yours" />
          <span>List your sites under an empty bar</span>
        </label>
        <button class="setting-manage" id="open-manager" type="button">
          Manage sites…
        </button>
      </div>

      <div class="modal" id="site-manager" hidden role="dialog" aria-modal="true" aria-label="Manage sites">
        <div class="modal-panel">
          <div class="modal-head">
            <strong>Sites</strong>
            <span class="modal-count" id="manager-count"></span>
            <button class="modal-close" id="manager-close" type="button" aria-label="Close">✕</button>
          </div>
          <form class="modal-add" id="manager-add-form">
            <input
              id="manager-add"
              type="text"
              autocomplete="off"
              spellcheck="false"
              autocapitalize="off"
              placeholder="Add a site by address — vadkul.se"
            />
            <button type="submit">Add</button>
          </form>
          <input
            class="modal-filter"
            id="manager-filter"
            type="text"
            autocomplete="off"
            spellcheck="false"
            autocapitalize="off"
            placeholder="Filter…"
          />
          <div class="modal-list" id="manager-list"></div>
        </div>
      </div>
    </main>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
